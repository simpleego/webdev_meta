<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 정보</title>
    <style>
        input {
            display: block;
        }
    </style>
</head>
<body>
    <h1>회원 목록</h1>
    <a href="/user/add">사용자 등록</a>
    <table border="1">
        <tr>
            <th>아이디</th>
            <th>이름</th>
            <th>이메일</th>
            <th>삭제</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td><a th:href="@{/user/edit/{id}(id=${user.id})}" th:text="${user.name}"></a>
            <td th:text="${user.email}"></td>
            <td>
                <form th:action="@{/user/delete}" method="post">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <button type="submit">삭제</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
