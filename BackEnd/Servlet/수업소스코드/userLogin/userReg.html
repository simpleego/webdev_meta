<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원가입</title>
<style>
	#container {
		width: 600px;
		margin: 30px auto;
		border: 10px solid #ddd;
		padding: 5px;	
	}
	
	input {
	 display: block;
	}
</style>
</head>
<body>
	<div id="container">
	<form action="user_reg" method="post">
		<label>아이디</label>
		<input type="text" name=id  placeholder="숫자영문자포함 8자이상">
		<label>비밀번호</label>
		<input type="password" name=password placeholder="숫자영문자포함 8자이상">
		<label>이름</label>
		<input type="text" name=name placeholder="한글이름">
		<label>휴대폰</label>
		<input type="text" name=tel placeholder="010-xxxx-xxxx">
		<label>주소</label>
		<input type="text" name=addr placeholder="주소를 입력하세요">
		<input type="submit" value="가입하기">
	</form>	
	</div>

</body>
</html>
