<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>회원가입-중복확인</title>
</head>
<body>
<h2>회원가입</h2>
<input type="text" id="username" placeholder="아이디 입력">
<button onclick="checkUsername()">중복 확인</button>
<p id="result"></p>
<script>
    function checkUsername() {
        const username = document.getElementById('username').value;
        fetch(`http://localhost:9090/api/users/check-username?username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(data => {
                const result = document.getElementById('result');
                if (data.duplicate) {
                    result.textContent = "❌ 이미 사용 중인 아이디입니다.";
                    result.style.color = "red";
                } else {
                    result.textContent = "✅ 사용 가능한 아이디입니다.";
                    result.style.color = "green";
                }
            })
            .catch(error => {
                console.error("중복 확인 실패:", error);
                document.getElementById('result').textContent = "⚠️ 서버 오류가 발생했습니다.";
            });
    }
</script>
</body>
</html>
