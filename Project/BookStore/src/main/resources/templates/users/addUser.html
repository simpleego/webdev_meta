<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        label {
            display: block;
        }
        input {
            box-sizing: border-box;
            width: 200px;
        }
        #userReg {
            box-sizing: border-box;
            width: 500px;
            margin: 10px auto;
            padding: 2em;
        }
        fieldset {
            box-sizing: border-box;
            border-radius: 5%;
            width: 350px;
            padding: 30px 100px;
            margin: 10px auto;
            font-weight: bold;
        }
        #regBtn {
            margin-top: 1em;
            box-sizing: border-box;
            width: 300px;
        }
    </style>
</head>
<body>
<div id="container">
    <header th:replace="common/header :: header"></header>
    <main id="sub_container">
        <div id="userReg">
            <form th:action="@{/user/add}" th:object="${user}" method="post">
                <fieldset>
                    <legend><h2>회원 가입</h2></legend>
                <label>아이디</label><input type="text" th:field="*{userName}"/>
                <label>비밀번호</label> <input type="password" th:field="*{password}"/>
                <label>이 름</label> <input type="text" th:field="*{name}"/>
                <label>생 일</label> <input type="date" th:field="*{birthday}"/>
                <label>이메일</label> <input type="email" th:field="*{email}"/>
                <label>휴대폰</label> <input type="tel" th:field="*{phone}"/>
                    <label style="display: inline-block" for="roadAddress">주 소</label>
                    <button style="margin-left: 96px; margin-bottom: 3px" type="button"  onclick="execDaumPostcode()">주소찾기</button>
                    <input type="text"  id="roadAddress"  th:field="*{address}"/>

                <button style="width:200px; padding: 13px; display: block" type="submit">회원가입</button>
                </fieldset>
            </form>
            <div id="regBtn" th:if="${errorMessage}" th:text="${errorMessage}" style="color:red"></div>
        </div>
    </main>
    <footer th:replace="common/footer :: footer"></footer>
</div>
</body>
<script>
    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                // 도로명 주소와 우편번호를 입력 필드에 자동으로 채움
                //document.getElementById('postcode').value = data.zonecode;
                document.getElementById('roadAddress').value = data.roadAddress;

                // 상세 주소 입력란에 포커스 이동
                //document.getElementById('detailAddress').focus();
            }
        }).open();
    }
</script>
</html>
