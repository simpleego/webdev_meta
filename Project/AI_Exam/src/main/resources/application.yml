spring:
  application:
    name: aiapi
  datasource:
    url: jdbc:h2:mem:gptquiz;DB_CLOSE_DELAY=-1;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
  thymeleaf:
    cache: false

logging.level.org.hibernate.SQL: debug

openai:
  api-key: '본인의 api 키값을 여기에 설정'

server:
  port: 9090
