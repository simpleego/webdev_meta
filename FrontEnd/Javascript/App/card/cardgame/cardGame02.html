<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드게임</title>
    <style>
        #container {
            text-align: center;
            width: 50%;
            margin: 30px auto;
        }

        .card {
            width: 60px;
            height: 60px;
            font-size: 24px;
            border: 1px solid #444;
            background-color: #f0f;
        }

        .hidden {
            background-color: #ccc;
            color: transparent;
        }

        #gameBoard {
            display: grid;
            /* grid-template-columns: repeat(3,100px); */
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="container">

        <h1>카드 숫자 맞추기 게임-1단계</h1>
        <p>게임판 그리기</p>
        <label for="">힌트(2회까지) : 2초간 보여주기</label>
        <button id="hint">보기</button><br>

        <label for="">게임판 수 : </label>
        <input type="number" id="sizeInput" value="5" min="3" max="10">

        <button id="board">게임판 만들기</button>

        <div id="gameBoard">
            <!-- 여기에 카드 넣기  -->
        </div>
    </div>
</body>
<script>
    const $gameBoard = document.querySelector("#gameBoard");
    const $board = document.querySelector("#board");

    $board.addEventListener('click', () => {

        // 버튼 연결하고 이벤트 등록
        const size = parseInt(document.querySelector("#sizeInput").value);

        const totalCells = size * size;
        console.log('totalCells :' + totalCells);

        $gameBoard.style.gridTemplateColumns = `repeat(${size},60px)`;
        $gameBoard.innerHTML = '';

        const pairCount = totalCells / 2;
        const numbers = [];

        for (let i = 1; i <= pairCount; i++) {
            numbers.push(i);
            numbers.push(i);
        }
        console.log(numbers);

        let temp = 0;

        const cards = [];

        for (let i = numbers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            console.log('j:' + j);

            // temp = numbers[i];
            // numbers[i] = numbers[j];
            // numbers[j] = temp;
            [numbers[i], numbers[j]] = [numbers[j], numbers[i]];

        }

        for (let i = 0; i < totalCells; i++) {
            const card = document.createElement("div");
            card.className = "card";
            card.textContent = numbers[i];
            $gameBoard.appendChild(card);

            cards.push(card);
        }
        console.log(cards);

        // 3초후에 카드 숨기기
        setTimeout(() => {
            cards.forEach(card => {
                //card 속성 추가
                card.classList.add("hidden");
            });
        }, 3000)


        const hintBtn = document.querySelector("#hint");

        // 힌트: 2초간 보여주고 숨기기
        hintBtnCount =0;
        document.querySelector("#hint").addEventListener("click", () => {

            hintBtnCount++;

            // 카드 보여주기
            cards.forEach(card => {
                card.classList.remove("hidden");
            });

            setTimeout(() => {
                cards.forEach(card => {
                    //card 속성 추가
                    card.classList.add("hidden");
                });
            }, 2000);

            if(hintBtnCount >=2 ){
                hintBtn.disabled = true;
            }

        });

    });


</script>

</html>
