<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Fetch 사용법</h1>
    <p>가져올 사용자의 아이디를 입력 하세요(1~10)</p>
    <label>사용자 ID</label>
    <input id="user" type="number" min="1" max="10" value="1"> 
    <button onclick="loadData()">데이터 가져오기</button>    
    <button onclick="initData()">데이터 초기화</button>
    <div id="data">
    </div>
</body>
<script>
    const $data = document.querySelector('#data');
    const $user = document.querySelector('#user');

    function loadData() {
        console.log($user);
        const selectUser =  parseInt($user.value);
        fetch('https://jsonplaceholder.typicode.com/todos/')
            .then(response => response.json())
            .then(json => {
                for(let i=0; i<json.length; i++){                    
                    let  data = json[i];
                    if(data.userId === selectUser) {
                        $data.innerHTML += 
                        `${data.userId},${data.id},${data.title},${data.completed?"완료":"미완료"}<br>`; 
                    }
                }
                // json.forEach(data => {
                //     $data.innerHTML += 
                //     `${data.userId}, ${data.id},  ${data.title}, ${data.completed?"완료":"미완료"}<br>`;                    
                // });
            });
    }

    function initData() {
        $data.innerHTML = "";
    }
</script>

</html>
