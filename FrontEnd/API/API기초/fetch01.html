<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Fetch 사용법</h1>
    <button onclick="loadData()">데이터 가져오기</button>
    <div id="data">

    </div>
</body>
<script>
    function loadData() {
        const $data = document.querySelector('#data');

        fetch('https://jsonplaceholder.typicode.com/todos/1')
            .then(response => response.json())
            .then(json => {
                $data.innerHTML = json.userId+','+json.title+','+json.completed;
            });
    }
</script>

</html>
