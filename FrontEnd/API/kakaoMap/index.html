<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>카카오맵 역지오코딩 예제</title>
  <!-- kakao 네이티브 앱 키를 설정 -->
  <script type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ecec1b521685a6d456cefa6e4d4ddbcc&libraries=services"></script>
  <style>
    #map {
      width: 100%;
      height: 400px;
    }
  </style>
</head>

<body>
  <h3>현재 위치 주소 표시</h3>
  <div id="map"></div>
  <p id="address">주소를 불러오는 중...</p>

  <script>
    window.onload = function () {
      const lat = 36.3504;
      const lng = 127.3845;
      const mapContainer = document.getElementById('map');
      const mapOption = {
        center: new kakao.maps.LatLng(lat, lng),
        level: 3
      };

      const map = new kakao.maps.Map(mapContainer, mapOption);
      const geocoder = new kakao.maps.services.Geocoder();

      const coord = new kakao.maps.LatLng(lat, lng);
      geocoder.coord2Address(coord.getLng(), coord.getLat(), function (result, status) {
        if (status === kakao.maps.services.Status.OK) {
          const address = result[0].address.address_name;
          document.getElementById('address').textContent = '주소: ' + address;

          new kakao.maps.Marker({
            map: map,
            position: coord
          });
        }
      });
    };
  </script>
</body>

</html>
